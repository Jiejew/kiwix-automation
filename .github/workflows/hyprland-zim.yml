
name: Build Hyprland Wiki ZIM

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 1 * *"

permissions:
  contents: write

concurrency:
  group: hyprland-zim
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Prepare directories
        run: mkdir -p site release

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Mirror Hyprland documentation
        shell: bash
        run: |
          set -euo pipefail

          wget \
            --recursive \
            --level=inf \
            --no-parent \
            --no-host-directories \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --domains wiki.hypr.land \
            --wait=0.2 \
            --tries=3 \
            --timeout=30 \
            --directory-prefix=site \
            https://wiki.hypr.land/0.56.0/


      - name: Fix CSS filenames and references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("site")
          broken = list(root.rglob("*.css.html"))

          if not broken:
              raise SystemExit("No .css.html files found; inspect Wget output")

          for old in broken:
              new = old.with_suffix("")
              data = old.read_bytes()

              if data.lstrip().lower().startswith(
                  (b"<!doctype html", b"<html")
              ):
                  raise SystemExit(f"HTML instead of CSS: {old}")

              if new.exists():
                  raise SystemExit(f"Target already exists: {new}")

              old.rename(new)
              print(f"Fixed: {old} -> {new}")

          changed = 0

          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if path.suffix.lower() not in (".html", ".css", ".js"):
                  continue

              original = path.read_bytes()
              updated = original.replace(b".css.html", b".css")

              if updated != original:
                  path.write_bytes(updated)
                  changed += 1

          if list(root.rglob("*.css.html")):
              raise SystemExit("Unfixed CSS filenames remain")

          print(f"Fixed CSS files: {len(broken)}")
          print(f"Updated reference files: {changed}")
          PY


      - name: Validate downloaded pages
        shell: bash
        run: |
          set -euo pipefail

          base="site/0.56.0"
          test -s "$base/index.html"

          count=$(find "$base" -type f \
            -name 'index.html' | wc -l)

          echo "Downloaded HTML pages: $count"
          test "$count" -ge 30

          for page in \
            "Configuring/Basics/Monitors" \
            "Configuring/Basics/Variables" \
            "Configuring/Basics/Window-Rules"
          do
            test -s "$base/$page/index.html" || {
              echo "Missing: $page"
              exit 1
            }
          done

      - name: Prepare illustration
        run: |
          curl -fL \
            https://wiki.hypr.land/0.56.0/apple-touch-icon.png \
            -o icon.png

          convert icon.png \
            -resize '48x48!' \
            site/illustration.png

      - name: Build ZIM
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            ghcr.io/openzim/zim-tools:latest \
            zimwriterfs \
            --welcome=0.56.0/index.html \
            --illustration=illustration.png \
            --language=eng \
            --name=hyprland_wiki_056 \
            --title="Hyprland Wiki 0.56" \
            --description="Hyprland 0.56 documentation" \
            --longDescription="Offline documentation for the Hyprland Wayland compositor, version 0.56." \
            --creator=Hyprland \
            --publisher=Jiejew \
            --source=https://wiki.hypr.land/0.56.0/ \
            /work/site \
            /work/release/hyprland_wiki.zim

      - name: Validate ZIM
        shell: bash
        run: |
          set -euo pipefail

          test -s release/hyprland_wiki.zim

          docker run --rm \
            -v "$PWD/release:/work:ro" \
            ghcr.io/openzim/zim-tools:latest \
            zimdump info /work/hyprland_wiki.zim

          cd release
          sha256sum hyprland_wiki.zim \
            > hyprland_wiki.zim.sha256

          ls -lh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="hyprland-056-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$tag" \
            release/hyprland_wiki.zim \
            release/hyprland_wiki.zim.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title="Hyprland Wiki 0.56" \
            --notes="Offline Hyprland documentation" \
            --latest
